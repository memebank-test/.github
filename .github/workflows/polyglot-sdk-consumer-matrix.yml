name: Polyglot SDK consumer matrix

on:
  workflow_dispatch:
  repository_dispatch:
    types: [clients-repository-ready, clients-updated]

permissions:
  contents: read

jobs:
  sdk-clients:
    uses: zed-pkg-test/.github/.github/workflows/sdk-client-language-matrix.yml@df3eed96202810b7e7d6667fabc3041b19e6a22f
    with:
      clients_repository: memebank/mb-clients
      clients_ref: e0056a1b280d2758c5d4c9d94519539c7eaece3e
      clients_root: clients
    secrets:
      read_token: ${{ secrets.TEST_FLEET_READ_TOKEN }}
